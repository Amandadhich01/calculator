<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Calculator</title>
  <meta name="description" content="A clean, responsive calculator with Standard, Scientific, and Unit Converter modes." />

  <!-- Favicon -->
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220%22%3E<text y=%2226%22 font-size=%2228%22>🧮</text></svg>">

  <!-- Font -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;600;700&display=swap" rel="stylesheet">

  <!-- Stylesheet -->
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <div class="app-container" id="appContainer">
    <!-- Top Header -->
    <header class="app-header">
      <div class="app-title">
        <span>Calculator</span>
      </div>

      <div class="header-actions">
        <button id="themeToggleBtn" class="icon-btn" title="Toggle Theme">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
        </button>
        <button id="historyToggleBtn" class="icon-btn" title="History">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
        </button>
      </div>
    </header>

    <!-- Mode Navigation Tabs -->
    <nav class="mode-nav">
      <button class="mode-tab active" data-mode="standard">Standard</button>
      <button class="mode-tab" data-mode="scientific">Scientific</button>
      <button class="mode-tab" data-mode="converter">Converter</button>
    </nav>

    <!-- Main Calculator Card -->
    <main class="calculator-card">

      <!-- Display Section (Standard & Scientific) -->
      <section id="displaySection" class="calc-display">
        <div class="display-top-bar">
          <div>
            <span id="angleBadge" class="badge-tag" title="Switch DEG / RAD">DEG</span>
            <span id="memoryIndicator" style="margin-left: 6px; color: var(--text-accent); font-weight: 700; display: none;">M</span>
          </div>
          <div class="display-tools">
            <button id="copyResultBtn" class="display-tool-btn">Copy</button>
            <button id="backspaceBtn" class="display-tool-btn">⌫</button>
          </div>
        </div>

        <div id="displayExpression" class="display-expression"></div>
        <div id="displayResult" class="display-result">0</div>
      </section>

      <!-- Memory Bar -->
      <section id="memorySection" class="memory-bar">
        <button class="mem-btn" data-action="mem" data-val="MC">MC</button>
        <button class="mem-btn" data-action="mem" data-val="MR">MR</button>
        <button class="mem-btn" data-action="mem" data-val="M+">M+</button>
        <button class="mem-btn" data-action="mem" data-val="M-">M−</button>
        <button class="mem-btn" data-action="mem" data-val="MS">MS</button>
      </section>

      <!-- Standard Keypad -->
      <div id="standardKeypad" class="keypad keypad-standard">
        <button class="calc-btn btn-clear" data-action="clear">AC</button>
        <button class="calc-btn btn-fn" data-action="toggle-sign">±</button>
        <button class="calc-btn btn-fn" data-action="percent">%</button>
        <button class="calc-btn btn-op" data-action="op" data-val="÷">÷</button>

        <button class="calc-btn btn-num" data-action="num" data-val="7">7</button>
        <button class="calc-btn btn-num" data-action="num" data-val="8">8</button>
        <button class="calc-btn btn-num" data-action="num" data-val="9">9</button>
        <button class="calc-btn btn-op" data-action="op" data-val="×">×</button>

        <button class="calc-btn btn-num" data-action="num" data-val="4">4</button>
        <button class="calc-btn btn-num" data-action="num" data-val="5">5</button>
        <button class="calc-btn btn-num" data-action="num" data-val="6">6</button>
        <button class="calc-btn btn-op" data-action="op" data-val="−">−</button>

        <button class="calc-btn btn-num" data-action="num" data-val="1">1</button>
        <button class="calc-btn btn-num" data-action="num" data-val="2">2</button>
        <button class="calc-btn btn-num" data-action="num" data-val="3">3</button>
        <button class="calc-btn btn-op" data-action="op" data-val="+">+</button>

        <button class="calc-btn btn-num btn-zero" data-action="num" data-val="0">0</button>
        <button class="calc-btn btn-num" data-action="dot">.</button>
        <button class="calc-btn btn-equals" data-action="equals">=</button>
      </div>

      <!-- Scientific Keypad -->
      <div id="scientificKeypad" class="keypad keypad-scientific" style="display: none;">
        <!-- Row 1 -->
        <button class="calc-btn btn-fn" data-action="fn" data-val="sin">sin</button>
        <button class="calc-btn btn-fn" data-action="fn" data-val="cos">cos</button>
        <button class="calc-btn btn-fn" data-action="fn" data-val="tan">tan</button>
        <button class="calc-btn btn-fn" data-action="paren" data-val="(">(</button>
        <button class="calc-btn btn-fn" data-action="paren" data-val=")">)</button>

        <!-- Row 2 -->
        <button class="calc-btn btn-fn" data-action="fn" data-val="asin">sin⁻¹</button>
        <button class="calc-btn btn-fn" data-action="fn" data-val="acos">cos⁻¹</button>
        <button class="calc-btn btn-fn" data-action="fn" data-val="atan">tan⁻¹</button>
        <button class="calc-btn btn-fn" data-action="constant" data-val="pi">π</button>
        <button class="calc-btn btn-fn" data-action="constant" data-val="e">e</button>

        <!-- Row 3 -->
        <button class="calc-btn btn-fn" data-action="fn" data-val="sq">x²</button>
        <button class="calc-btn btn-fn" data-action="fn" data-val="pow">xʸ</button>
        <button class="calc-btn btn-fn" data-action="fn" data-val="sqrt">√x</button>
        <button class="calc-btn btn-clear" data-action="clear">AC</button>
        <button class="calc-btn btn-op" data-action="op" data-val="÷">÷</button>

        <!-- Row 4 -->
        <button class="calc-btn btn-fn" data-action="fn" data-val="log">log</button>
        <button class="calc-btn btn-num" data-action="num" data-val="7">7</button>
        <button class="calc-btn btn-num" data-action="num" data-val="8">8</button>
        <button class="calc-btn btn-num" data-action="num" data-val="9">9</button>
        <button class="calc-btn btn-op" data-action="op" data-val="×">×</button>

        <!-- Row 5 -->
        <button class="calc-btn btn-fn" data-action="fn" data-val="ln">ln</button>
        <button class="calc-btn btn-num" data-action="num" data-val="4">4</button>
        <button class="calc-btn btn-num" data-action="num" data-val="5">5</button>
        <button class="calc-btn btn-num" data-action="num" data-val="6">6</button>
        <button class="calc-btn btn-op" data-action="op" data-val="−">−</button>

        <!-- Row 6 -->
        <button class="calc-btn btn-fn" data-action="fn" data-val="fact">n!</button>
        <button class="calc-btn btn-num" data-action="num" data-val="1">1</button>
        <button class="calc-btn btn-num" data-action="num" data-val="2">2</button>
        <button class="calc-btn btn-num" data-action="num" data-val="3">3</button>
        <button class="calc-btn btn-op" data-action="op" data-val="+">+</button>

        <!-- Row 7 -->
        <button class="calc-btn btn-fn" data-action="fn" data-val="inv">1/x</button>
        <button class="calc-btn btn-num" data-action="num" data-val="0">0</button>
        <button class="calc-btn btn-num" data-action="dot">.</button>
        <button class="calc-btn btn-fn" data-action="toggle-sign">±</button>
        <button class="calc-btn btn-equals" data-action="equals">=</button>
      </div>

      <!-- Unit Converter View -->
      <div id="converterView" class="converter-wrap" style="display: none;">
        <div class="converter-categories">
          <button class="cat-chip active" data-type="length">Length</button>
          <button class="cat-chip" data-type="mass">Weight</button>
          <button class="cat-chip" data-type="temperature">Temperature</button>
          <button class="cat-chip" data-type="storage">Digital</button>
          <button class="cat-chip" data-type="speed">Speed</button>
          <button class="cat-chip" data-type="time">Time</button>
        </div>

        <div class="converter-box">
          <div class="conv-field">
            <span class="conv-label">From</span>
            <div class="conv-row">
              <input type="number" id="convVal1" class="conv-input" value="1" placeholder="0" />
              <select id="convUnit1" class="conv-select"></select>
            </div>
          </div>

          <button id="convSwapBtn" class="conv-swap" title="Swap Units">⇅</button>

          <div class="conv-field">
            <span class="conv-label">To</span>
            <div class="conv-row">
              <input type="number" id="convVal2" class="conv-input" placeholder="0" />
              <select id="convUnit2" class="conv-select"></select>
            </div>
          </div>
        </div>
      </div>

      <!-- History Drawer -->
      <aside id="historyDrawer" class="history-drawer">
        <div class="history-head">
          <span>History</span>
          <button id="closeHistoryBtn" class="icon-btn" style="width: 28px; height: 28px;">✕</button>
        </div>
        <div id="historyList" class="history-items"></div>
        <div class="history-foot">
          <button id="clearHistoryBtn" class="btn-clear-history">Clear History</button>
        </div>
      </aside>

    </main>

    <!-- Footer -->
    <footer class="app-footer">
      <div>Aman Dadhich • <a href="https://github.com/Amandadhich01/calculator" target="_blank">View on GitHub</a></div>
    </footer>
  </div>

  <!-- Toast -->
  <div id="toastBox" class="toast-notice"></div>

  <!-- JavaScript -->
  <script src="js/calculator.js"></script>
</body>
</html>
